name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Pasang kebutuhan sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Pasang Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv setuptools

      - name: Build APK
        run: buildozer -v android debug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: kasir-apk
          path: bin/*.apk
